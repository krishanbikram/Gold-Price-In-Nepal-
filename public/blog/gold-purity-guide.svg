<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- gold ring -->
  <circle cx="830" cy="290" r="170" fill="none" stroke="url(#gold)" stroke-width="34"/>
  <circle cx="830" cy="290" r="170" fill="none" stroke="#FDE68A" stroke-width="6" opacity="0.5"/>
  <!-- hallmark stamp -->
  <g transform="rotate(-12 830 290)">
    <rect x="712" y="238" width="236" height="104" rx="10" fill="none" stroke="#F59E0B" stroke-width="5"/>
    <text x="830" y="282" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#FCD34D" text-anchor="middle">999.9</text>
    <text x="830" y="322" font-family="Verdana, sans-serif" font-size="21" letter-spacing="3" fill="#FCD34D" text-anchor="middle">HALLMARK</text>
  </g>
  <!-- magnifier -->
  <circle cx="985" cy="440" r="62" fill="none" stroke="#E2E8F0" stroke-width="10"/>
  <line x1="1030" y1="488" x2="1095" y2="553" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round"/>
  <text x="90" y="240" font-family="Verdana, sans-serif" font-size="30" fill="#F59E0B" letter-spacing="2">GUIDE</text>
  <text x="88" y="330" font-family="Verdana, sans-serif" font-size="66" font-weight="bold" fill="#FFFFFF">How to Check</text>
  <text x="88" y="408" font-family="Verdana, sans-serif" font-size="66" font-weight="bold" fill="#FFFFFF">Gold <tspan fill="#F59E0B">Purity</tspan></text>
  <text x="90" y="478" font-family="Verdana, sans-serif" font-size="28" fill="#94A3B8">Hallmark, touchstone &amp; XRF tests in Nepal</text>
</svg>
